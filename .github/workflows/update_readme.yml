name: Update README

on:
  push:
    branches:
      - main  # Основная ветка вашего репозитория

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Clear and update README.md
      run: |
        # Очищаем файл README.md и записываем новое содержимое
        echo "# soullesscoffee" > README.md
        echo '<a href="https://discord.gg/ZSUpv25GRz"><img src="https://img.shields.io/discord/907577663810576405.svg?style=flat&label=Join%20Community&color=7289DA" alt="Join Community Badge"/></a>' >> README.md
        echo "" >> README.md
        echo "## Участники" >> README.md
        echo "- Участник 1" >> README.md
        echo "- Участник 2" >> README.md
        echo "- Участник 3" >> README.md
        # Добавьте больше участников по мере необходимости

    - name: Commit changes
      run: |
        git config --local user.email "cookiekomori@outlook.com"  # Укажите ваш email
        git config --local user.name "cookiiekomori"  # Укажите ваше имя
        git add README.md
        git commit -m "Update README.md" || echo "No changes to commit"

    - name: Push changes
      run: |
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/cookiiekomori/soullesscoffee.git HEAD:main
